# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

app_title: "Z N ENTERPRISES"
backend:
  name: github
  repo: irfatech/znenterprises
  branch: main

logo:
  src: /zn-enterprises-logo.png
  show_in_header: true

media_folder: "public/images"
public_folder: "/images"

media_libraries:
  default:
    config:
      max_file_size: 5242880
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2048

collections:
  - name: "pages"
    label: "Pages"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Image", name: "image", widget: "image", required: false }
          - { label: "No Index", name: "noIndex", widget: "boolean", required: false, default: false }

  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Author", name: "author", widget: "string", default: "Z N ENTERPRISES" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Category", name: "category", widget: "string", default: "General" }
      - { label: "Tags", name: "tags", widget: "list", required: false, field: { label: "Tag", name: "tag", widget: "string" } }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "products"
    label: "Products"
    folder: "src/content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Excerpt", name: "excerpt", widget: "string", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Images", name: "images", widget: "list", required: false, field: { label: "Image", name: "image", widget: "image" } }
      - { label: "Features", name: "features", widget: "list", required: false, field: { label: "Feature", name: "feature", widget: "string" } }
      - { label: "Category", name: "category", widget: "string", default: "General" }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0 }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "services"
    label: "Services"
    folder: "src/content/services"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Excerpt", name: "excerpt", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0 }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Features", name: "features", widget: "list", required: false, field: { label: "Feature", name: "feature", widget: "string" } }
      - { label: "CTA Text", name: "ctaText", widget: "string", default: "Learn More" }
      - { label: "CTA Link", name: "ctaLink", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "testimonials"
    label: "Testimonials"
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string", required: false }
      - { label: "Company", name: "company", widget: "string", required: false }
      - { label: "Avatar", name: "avatar", widget: "image", required: false }
      - { label: "Rating", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5 }
      - { label: "Content", name: "content", widget: "text" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }

  - name: "team"
    label: "Team Members"
    folder: "src/content/team"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Bio", name: "bio", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0 }

  - name: "faq"
    label: "FAQs"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Category", name: "category", widget: "string", default: "General" }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0 }

  - name: "gallery"
    label: "Gallery"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: false }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Category", name: "category", widget: "string", default: "General" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Date", name: "date", widget: "datetime", required: false }

  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Client", name: "client", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Category", name: "category", widget: "string", default: "General" }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0 }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - label: "Images"
        name: "images"
        widget: "list"
        field: { label: "Image", name: "image", widget: "image" }
        hint: "Upload one or more project photos. The first image is used as the cover."

  - name: "partners"
    label: "Partners"
    folder: "src/content/partners"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Logo", name: "logo", widget: "image" }
      - { label: "URL", name: "url", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0 }

  - name: "site-settings"
    label: "Site Settings"
    files:
      - label: "Settings"
        name: "settings"
        file: "src/content/site-settings/settings.yaml"
        fields:
          - { label: "Site Name", name: "siteName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "URL", name: "url", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image", required: false }
          - { label: "Favicon", name: "favicon", widget: "string", required: false }
          - label: "Phone"
            name: "phone"
            widget: "list"
            field: { label: "Number", name: "number", widget: "string" }
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "Address", name: "address", widget: "text", required: false }
          - { label: "Working Hours", name: "workingHours", widget: "string", required: false }
          - { label: "Google Maps Embed URL", name: "googleMapsEmbedUrl", widget: "string", required: false }
          - label: "Social"
            name: "social"
            widget: "object"
            required: false
            fields:
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }
              - { label: "WhatsApp", name: "whatsapp", widget: "string", required: false }

  - name: "hero"
    label: "Hero Section"
    files:
      - label: "Hero Content"
        name: "hero"
        file: "src/content/hero/hero.yaml"
        fields:
          - { label: "Badge Text", name: "badge", widget: "string" }
          - { label: "Heading Line 1", name: "headingLine1", widget: "string" }
          - { label: "Heading Line 2", name: "headingLine2", widget: "string" }
          - { label: "Heading Line 3", name: "headingLine3", widget: "string" }
          - { label: "Highlight Line (1-3)", name: "highlightLine", widget: "number", value_type: "int", min: 1, max: 3, default: 2 }
          - { label: "Subtitle", name: "subtitle", widget: "text" }
          - { label: "Primary CTA Text", name: "ctaPrimaryText", widget: "string" }
          - { label: "Primary CTA Link", name: "ctaPrimaryLink", widget: "string" }
          - { label: "Secondary CTA Text", name: "ctaSecondaryText", widget: "string" }
          - { label: "Secondary CTA Link", name: "ctaSecondaryLink", widget: "string" }
          - label: "Trust Badges"
            name: "trustBadges"
            widget: "list"
            fields:
              - { label: "Text", name: "text", widget: "string" }
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - { label: "Hero Image Alt Text", name: "heroImageAlt", widget: "string", required: false }

  - name: "about"
    label: "About"
    files:
      - label: "About Content"
        name: "about"
        file: "src/content/about/about.yaml"
        fields:
          - label: "Page Hero"
            name: "heroLabel"
            widget: "string"
          - { label: "Hero Heading", name: "heroHeading", widget: "string" }
          - { label: "Hero Highlight Word", name: "heroHighlight", widget: "string" }
          - { label: "Hero Description", name: "heroDescription", widget: "text" }
          - label: "Our Story"
            name: "storyImage"
            widget: "image"
          - { label: "Story Image Alt", name: "storyImageAlt", widget: "string", required: false }
          - { label: "Story Heading", name: "storyHeading", widget: "string" }
          - { label: "Story Highlight", name: "storyHighlight", widget: "string" }
          - label: "Story Paragraphs"
            name: "storyParagraphs"
            widget: "list"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Mission & Vision"
            name: "missionTitle"
            widget: "string"
          - { label: "Mission Text", name: "missionText", widget: "text" }
          - { label: "Vision Title", name: "visionTitle", widget: "string" }
          - { label: "Vision Text", name: "visionText", widget: "text" }
          - label: "Values Section"
            name: "valuesSectionLabel"
            widget: "string"
          - { label: "Values Heading", name: "valuesHeading", widget: "string" }
          - { label: "Values Highlight", name: "valuesHighlight", widget: "string" }
          - { label: "Values Subtitle", name: "valuesSubtitle", widget: "text" }
          - label: "Values"
            name: "values"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Homepage Section"
            name: "homeLabel"
            widget: "string"
          - { label: "Home Heading", name: "homeHeading", widget: "string" }
          - { label: "Home Highlight", name: "homeHighlight", widget: "string" }
          - label: "Home Paragraphs"
            name: "homeParagraphs"
            widget: "list"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - { label: "Home Image 1", name: "homeImage1", widget: "image" }
          - { label: "Home Image 1 Alt", name: "homeImage1Alt", widget: "string", required: false }
          - { label: "Home Image 2", name: "homeImage2", widget: "image" }
          - { label: "Home Image 2 Alt", name: "homeImage2Alt", widget: "string", required: false }
          - label: "CTA"
            name: "ctaTitle"
            widget: "string"
          - { label: "CTA Description", name: "ctaDescription", widget: "text" }
          - { label: "CTA Primary Label", name: "ctaPrimaryLabel", widget: "string" }
          - { label: "CTA Primary Link", name: "ctaPrimaryLink", widget: "string" }
          - { label: "CTA Secondary Label", name: "ctaSecondaryLabel", widget: "string" }
          - { label: "CTA Secondary Link", name: "ctaSecondaryLink", widget: "string" }

  - name: "process"
    label: "Process Timeline"
    files:
      - label: "Process Steps"
        name: "process"
        file: "src/content/process/process.yaml"
        fields:
          - { label: "Section Label", name: "sectionLabel", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Highlight Word", name: "highlightWord", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "text" }
          - label: "Steps"
            name: "steps"
            widget: "list"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  - name: "navigation"
    label: "Navigation"
    files:
      - label: "Main Navigation"
        name: "nav"
        file: "src/content/navigation/nav.yaml"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Href", name: "href", widget: "string" }
              - label: "Children"
                name: "children"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Href", name: "href", widget: "string" }

  - name: "footer"
    label: "Footer"
    files:
      - label: "Footer Content"
        name: "footer"
        file: "src/content/footer/footer.yaml"
        fields:
          - { label: "Description", name: "description", widget: "text", required: false }
          - label: "Columns"
            name: "columns"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Links"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Href", name: "href", widget: "string" }
          - { label: "Bottom Text", name: "bottomText", widget: "string", required: false }
